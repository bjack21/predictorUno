
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro N os | 180-Alpha Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      body {
        background-color: #050505;
        color: white;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }

      .tactical-outline {
        position: relative;
        border: 1px solid rgba(245, 158, 11, 0.4);
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.08), inset 0 0 15px rgba(245, 158, 11, 0.03);
      }

      .tactical-outline::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.05);
        pointer-events: none;
        border-radius: inherit;
      }

      .art-border-glow {
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3), 0 0 30px rgba(245, 158, 11, 0.1);
      }

      .floating-art {
        animation: float 20s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(10px, -20px) rotate(5deg); }
        66% { transform: translate(-15px, 15px) rotate(-5deg); }
      }

      .scanline-sweep {
        position: relative;
        overflow: hidden;
      }

      .scanline-sweep::before {
        content: "";
        position: absolute;
        top: -100%;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(245, 158, 11, 0.05),
          transparent
        );
        animation: sweep 4s linear infinite;
        pointer-events: none;
      }

      @keyframes sweep {
        0% { top: -100%; }
        100% { top: 100%; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      @keyframes scanY {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .animate-scan-y {
        animation: scanY 3s linear infinite;
      }

      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-right {
        animation: slideInRight 0.3s ease-out forwards;
      }

      @keyframes slideInUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-in-up {
        animation: slideInUp 0.3s ease-out forwards;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(245, 158, 11, 0.3);
        border-radius: 10px;
      }
    </style>
